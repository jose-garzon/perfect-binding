<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfect Binding</title>
    <!--
      Declared here rather than in app.css on purpose: Bun's CSS bundler
      resolves and inlines small url() assets as data: URIs, which the Electron
      CSP (default-src 'self', no font-src) blocks. An inline <style> is copied
      through untouched, so these stay as file requests. See build.ts.
    -->
    <style>
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("./fonts/archivo-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("./fonts/newsreader-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Newsreader";
        font-style: italic;
        font-weight: 400 700;
        font-display: swap;
        src: url("./fonts/newsreader-latin-italic.woff2") format("woff2");
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
