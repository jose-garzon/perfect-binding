<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Perfect Binding app mark: a magazine standing cover-out, its glued spine
       turned toward the viewer. Palette is the app's own. Source of truth for
       every raster icon; run `bun run icon` after editing. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#2a2521"/>
      <stop offset="1" stop-color="#100e0c"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="1" stop-color="#f0eadd"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cdc5b4"/>
      <stop offset="1" stop-color="#f7f3ea"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="-10" dy="34" stdDeviation="30" flood-color="#000000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#ground)"/>

  <g filter="url(#drop)">
    <!-- the spine: the folded-and-glued edge the whole app is named for -->
    <path d="M246 262 L318 200 L318 856 L246 918 Z" fill="url(#spine)"/>
    <path d="M246 262 L318 200 L318 856 L246 918 Z" fill="#12110f" opacity=".1"/>

    <!-- cover -->
    <path d="M318 200 L790 200 L790 856 L318 856 Z" fill="url(#cover)"/>
    <!-- the gutter shadow next to the spine -->
    <rect x="318" y="200" width="40" height="656" fill="#12110f" opacity=".07"/>

    <!-- fore-edge: the trimmed page block -->
    <g fill="#12110f" opacity=".16">
      <rect x="790" y="200" width="6" height="656"/>
      <rect x="800" y="208" width="4" height="640" opacity=".7"/>
    </g>

    <!-- masthead -->
    <rect x="386" y="252" width="352" height="62" rx="10" fill="#12110f"/>

    <!-- cover story -->
    <rect x="386" y="360" width="352" height="268" rx="6" fill="#b3402a"/>

    <!-- coverlines -->
    <rect x="386" y="672" width="264" height="24" rx="12" fill="#12110f"/>
    <g fill="#12110f" opacity=".45">
      <rect x="386" y="722" width="352" height="16" rx="8"/>
      <rect x="386" y="758" width="300" height="16" rx="8"/>
    </g>
  </g>
</svg>
